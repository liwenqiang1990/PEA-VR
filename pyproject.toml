[build-system]
requires = ["setuptools==75.1.0", "wheel==0.44.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pea-vr"
version = "2.0.0"
description = "Partial-evidence alignment for few-shot encrypted video recognition"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = ["numpy>=1.26,<3", "torch>=2.6,<3", "scikit-learn>=1.5,<2", "scipy>=1.13,<2", "PyYAML>=6,<7", "requests>=2.32,<3"]

[project.optional-dependencies]
test = ["pytest>=7.4,<9"]
plots = ["matplotlib>=3.8,<4"]

[project.scripts]
pea-vr = "pea_vr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["data: requires public dataset files", "cuda: requires CUDA"]
